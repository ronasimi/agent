# ==========================================
# FILE: docker-compose.yml
# ==========================================
services:
  storage-init:
    build: .
    image: agent
    container_name: agent-storage-init
    restart: "no"
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    environment:
      - STORAGE_ROOT=/state
      - AGENT_UID=1000
      - AGENT_GID=1000
    entrypoint: ["/bin/sh", "/app/scripts/init_storage.sh"]
    volumes:
      - ./workspace:/state/workspace
      - ./memory:/state/memory

  decision-engine:
    build: .
    image: agent
    container_name: agent-decision-engine
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    pids_limit: 128
    mem_limit: 3072m
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    network_mode: host
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      - TZ=${TZ:-America/Toronto}
      - HF_HOME=/cache/huggingface
    command: ["python", "-m", "uvicorn", "al_agent.decision_server:app", "--host", "127.0.0.1", "--port", "8091"]
    volumes:
      - ./config:/app/config:ro
      - ./memory/huggingface:/cache/huggingface

  agent:
    build: .
    image: agent
    container_name: agent
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    stdin_open: true
    tty: true
    pid: host
    network_mode: host
    user: "1000:1000"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      decision-engine:
        condition: service_started
    environment:
      - XDG_RUNTIME_DIR=/run/user/1000
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-1}
      - TZ=${TZ:-America/Toronto}
      - TERM=xterm-256color
    volumes:
      - ./config:/app/config:ro
      - ./workspace:/app/workspace
      - ./memory:/app/memory
      - ./tools:/app/tools:ro
      - ./agent.py:/app/agent.py:ro
      - ./:/app/source:ro
      - /:/host:ro
      - /var/log:/host_log:ro
      - /run/user/1000/bus:/run/user/1000/bus
      - ${HOME}/.config/systemd/user:/home/agent/.config/systemd/user
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/localtime:/etc/localtime:ro

  worker:
    build: .
    image: agent
    container_name: agent-worker
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    pid: host
    network_mode: host
    environment:
      - XDG_RUNTIME_DIR=/run/user/1000
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-1}
      - TZ=${TZ:-America/Toronto}
    command: ["python", "/app/worker.py"]
    depends_on:
      storage-init:
        condition: service_completed_successfully
      decision-engine:
        condition: service_started
      optimizer-validator:
        condition: service_started
    volumes:
      - ./config:/app/config:ro
      - ./workspace:/app/workspace
      - ./memory:/app/memory
      - ./tools:/app/tools:ro
      - ./worker.py:/app/worker.py:ro
      - ./:/app/source:ro
      - /:/host:ro
      - /var/log:/host_log:ro
      - /run/user/1000/bus:/run/user/1000/bus
      - ${HOME}/.config/systemd/user:/home/agent/.config/systemd/user
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/localtime:/etc/localtime:ro

  optimizer-validator:
    build: .
    image: agent
    container_name: agent-optimizer-validator
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    network_mode: none
    user: "0:0"
    read_only: true
    pids_limit: 128
    mem_limit: 1800m
    cpus: 1.0
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    depends_on:
      storage-init:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:size=1700m,mode=1777
    command: ["python", "/app/scripts/optimization_validator.py"]
    volumes:
      - ./config:/app/config:ro
      - ./workspace/self_optimization/candidates:/candidates:ro
      - ./workspace/self_optimization/validation/inbox:/validation/inbox:ro
      - ./workspace/self_optimization/validation/outbox:/validation/outbox

  webui:
    build: .
    image: agent
    container_name: agent-webui
    profiles:
      - web
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    pid: host
    network_mode: host
    depends_on:
      storage-init:
        condition: service_completed_successfully
      decision-engine:
        condition: service_started
    environment:
      - TZ=${TZ:-America/Toronto}
      - WEBUI_HOST=${WEBUI_HOST:-127.0.0.1}
      - WEBUI_PORT=${WEBUI_PORT:-8080}
      - WEBUI_MAX_UPLOAD_BYTES=${WEBUI_MAX_UPLOAD_BYTES:-16777216}
      - WEBUI_XRESOURCES=/host${HOME}/.Xresources
      - WEBUI_WORKSPACE_LIST_LIMIT=${WEBUI_WORKSPACE_LIST_LIMIT:-250}
    command:
      - /bin/sh
      - -lc
      - exec python -m uvicorn webui.server:app --host "$${WEBUI_HOST:-127.0.0.1}" --port "$${WEBUI_PORT:-8080}" --proxy-headers
    volumes:
      - ./config:/app/config:ro
      - ./workspace:/app/workspace
      - ./memory:/app/memory
      - ./tools:/app/tools:ro
      - ./agent.py:/app/agent.py:ro
      - ./webui:/app/webui:ro
      - ./:/app/source:ro
      - /:/host:ro
      - /var/log:/host_log:ro
      - /run/user/1000/bus:/run/user/1000/bus
      - ${HOME}/.config/systemd/user:/home/agent/.config/systemd/user
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/localtime:/etc/localtime:ro
