services:
  agent:
    build: .
    image: agent
    container_name: agent
    restart: unless-stopped
    pid: host                   # <--- Grants visibility into host processes
    devices:                    
      - /dev/video0:/dev/video0 # <--- Maps hardware (e.g., webcam)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
      - DISPLAY=:0
      - WAYLAND_DISPLAY=wayland-1 
    volumes:
      - ./config:/app/config
      - ./workspace:/app/workspace
      - ./memory:/app/memory
      - ./tools:/app/tools
      - ./agent.py:/app/agent.py
      - ./memory.py:/app/memory.py
      - /:/host:ro
      - /var/log:/host_log:ro
      - /run/user/1000/bus:/run/user/1000/bus
      - ~/.config/systemd/user:/app/workspace/host_timers
