# ==========================================
# FILE: docker-compose.yml
# ==========================================
services:
  storage-init:
    build: .
    image: agent
    container_name: agent-storage-init
    restart: "no"
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    environment:
      - STORAGE_ROOT=/state
      - CREDENTIAL_ROOT=/state/credentials
      - AGENT_UID=1000
      - AGENT_GID=1000
    entrypoint: ["/bin/sh", "/app/scripts/init_storage.sh"]
    volumes:
      - ./workspace:/state/workspace
      - ./memory:/state/memory
      - agent-credentials:/state/credentials

  worker:
    build: .
    image: agent
    container_name: agent-worker
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    pid: host
    network_mode: host
    environment:
      - XDG_RUNTIME_DIR=/run/user/1000
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-1}
      - TZ=${TZ:-America/Toronto}
      - AGENT_CREDENTIAL_DIR=/app/credentials
      - AGENT_CREDENTIAL_KEY=${AGENT_CREDENTIAL_KEY:-}
      - AGENT_CREDENTIAL_KEY_FILE=${AGENT_CREDENTIAL_KEY_FILE:-}
    command: ["python", "/app/worker.py"]
    depends_on:
      storage-init:
        condition: service_completed_successfully
      optimizer-validator:
        condition: service_started
    volumes:
      - ./config:/app/config:ro
      - ./workspace:/app/workspace
      - ./memory:/app/memory
      - agent-credentials:/app/credentials
      - ./tools:/app/tools:ro
      - ./worker.py:/app/worker.py:ro
      - ./:/app/source:ro
      - /:/host:ro
      - /var/log:/host_log:ro
      - /run/user/1000/bus:/run/user/1000/bus
      - ${HOME}/.config/systemd/user:/home/agent/.config/systemd/user
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/localtime:/etc/localtime:ro

  optimizer-validator:
    build: .
    image: agent
    container_name: agent-optimizer-validator
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    network_mode: none
    user: "0:0"
    read_only: true
    pids_limit: 128
    mem_limit: 1800m
    cpus: 1.0
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    depends_on:
      storage-init:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:size=1700m,mode=1777
    command: ["python", "/app/scripts/optimization_validator.py"]
    volumes:
      - ./config:/app/config:ro
      - ./workspace/self_optimization/candidates:/candidates:ro
      - ./workspace/self_optimization/validation/inbox:/validation/inbox:ro
      - ./workspace/self_optimization/validation/outbox:/validation/outbox

  webui:
    build: .
    image: agent
    container_name: agent-webui
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    pid: host
    network_mode: host
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      - TZ=${TZ:-America/Toronto}
      - WEBUI_HOST=${WEBUI_HOST:-127.0.0.1}
      - WEBUI_PORT=${WEBUI_PORT:-8080}
      - AGENT_CREDENTIAL_DIR=/app/credentials
      - AGENT_SOURCE_ROOT=/app/source
      - AGENT_CREDENTIAL_KEY=${AGENT_CREDENTIAL_KEY:-}
      - AGENT_CREDENTIAL_KEY_FILE=${AGENT_CREDENTIAL_KEY_FILE:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-}
      - WEBUI_MAX_UPLOAD_BYTES=${WEBUI_MAX_UPLOAD_BYTES:-16777216}
      - WEBUI_XRESOURCES=/host${HOME}/.Xresources
      - WEBUI_WORKSPACE_LIST_LIMIT=${WEBUI_WORKSPACE_LIST_LIMIT:-250}
    command: ["python", "-m", "webui"]
    volumes:
      - ./config:/app/config:ro
      - ./workspace:/app/workspace
      - ./memory:/app/memory
      - agent-credentials:/app/credentials
      - ./tools:/app/tools:ro
      - ./webui:/app/webui:ro
      - ./:/app/source
      - /:/host:ro
      - /var/log:/host_log:ro
      - /run/user/1000/bus:/run/user/1000/bus
      - ${HOME}/.config/systemd/user:/home/agent/.config/systemd/user
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/localtime:/etc/localtime:ro


volumes:
  agent-credentials:
    name: al-agent-credentials
