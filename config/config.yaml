# ==========================================
# FILE: config/config.yaml
# ==========================================
agent:
  # The Ollama server is intentionally external to this container.
  host: "http://127.0.0.1:11434"
  model: "agent-main:4b"
  fast_model: "agent-main:2b"
  # Multimodal role. For now this aliases the 4B main runner, so
  # image turns pay no extra model load or sidecar inference. Point this at a
  # dedicated vision model later; the harness will then use it as a no-tools
  # visual sidecar and return the observation to the main agent.
  vision_model: "agent-main:4b"
  vision_model_keep_alive: -1

  # Dedicated long-form research writer/verifier. /research uses this model
  # only after source collection. The worker temporarily evicts the interactive
  # and fast models while this larger model is resident, then restores them.
  report_model: "agent-report:9b"
  report_model_keep_alive: "10m"
  report_options:
    num_ctx: 8192
    temperature: 0.6
    top_p: 0.95
    top_k: 20
  report_restore_models_after_stage: true

  # Pin the small validator/research runner once loaded. The report stage may
  # evict it under memory pressure; it is then restored outside the foreground
  # inference lock during the next idle window.
  fast_model_keep_alive: -1
  # Optional semantic-memory model. Normal turn memory lookup is lexical while
  # semantic_memory_enabled is false, so this model does not need to be pulled
  # for ordinary chat/tool/recipe operation.
  embed_model: "nomic-embed-text"
  timezone: "America/Toronto"
  semantic_memory_enabled: false
  # Default to Ollama-compatible nothink. The WebUI Think checkbox (or /think on)
  # enables reasoning explicitly for the entire turn.
  thinking_default: false
  # Avoid synchronous per-fragment stdout logging while the model reasons.
  # Enable only for terminal debugging; the WebUI intentionally does not render
  # private reasoning deltas.
  log_thinking_trace: false
  show_perf_stats: true

  # Exact post-compaction Ollama request/completion traces for regression tests
  # and optional local fine-tuning. Rotated locally; no network export.
  model_traces:
    enabled: true
    path: "/app/memory/model_calls.jsonl"
    max_bytes: 268435456

  # Low-priority post-turn reflection. It runs only after substantial/failing
  # tool work or before compaction, yields to foreground inference, and stores
  # at most a few trigger-scoped operational notes.
  background_rethink:
    enabled: true
    min_tool_iterations: 4

  # Load the main model (and pre-fill its byte-stable system prefix) in the
  # background at frontend startup so the first turn pays neither the model
  # load nor the system-prompt prefill. The warm-up deliberately uses
  # main_options so Ollama does not reload the runner on the first real turn.
  warmup:
    enabled: true
    fast_model_prewarm: true
    # Tool-capable chat templates may place dynamic schemas before messages, so
    # a system-only prime often is not a reusable prefix. Keep it off by default;
    # use scripts/benchmark_warmup.py and model_stats.cache_hit_pct to verify before enabling.
    prime_system_prefix: false

  # Transport failures before the first streamed chunk are safe to retry and
  # should not consume a semantic/tool-loop iteration. Once streaming begins,
  # the request is never replayed because that could duplicate output/actions.
  model_transport:
    # Upper bound for one Ollama HTTP request/read stall. Streaming generation
    # may continue normally as long as the transport continues making progress.
    timeout_seconds: 60
    preflight_retries: 1
    base_delay_seconds: 0.15
    max_delay_seconds: 0.75

  max_iterations: 6
  # Broad explicit multi-check requests get an adaptive budget up to this cap.
  max_iterations_hard: 10
  # Interactive wall-clock and model-call budgets. The harness stops starting
  # new model/recovery work at the soft deadline and returns grounded partial
  # results deterministically rather than letting a compound task run away.
  turn_soft_timeout_seconds: 120
  turn_hard_timeout_seconds: 180
  max_model_calls_per_turn: 6
  # Stop repeated empty/invalid/error model responses before they consume the
  # global model-call safety budget. This is a no-progress guard, not a higher budget.
  model_no_progress_max_retries: 2
  # Qwen3.8-Distill is a reasoning model. On some Ollama/model combinations a
  # request can finish with message.thinking populated while content/tool_calls
  # remain empty. Retry that specific condition once with a short-reasoning mode
  # and a larger output allowance instead of consuming the generic no-progress
  # budget. Hidden reasoning is never surfaced as the answer.
  reasoning_recovery:
    enabled: true
    max_attempts: 1
    # Recovery itself always uses literal think=false. Qwen3.8's template has
    # a boolean thinking gate; string effort levels enter full reasoning.
    tool_num_predict: 1024
    final_num_predict: 2048
  max_validator_calls_per_turn: 2
  max_recovery_attempts_per_requirement: 2
  tool_turn_num_predict: 384
  final_num_predict: 1024
  tool_turn_temperature: 0.2
  # Required capabilities may expand the normal small schema set, but remain bounded.
  requirement_tool_cap: 24
  # Broad compound requests use only explicit requirement tools plus a tiny
  # deterministic fallback set. This prevents irrelevant schemas from bloating
  # prompt prefill and tempting small models into substitute tools.
  requirement_led_schema_only: true
  # Keep each small-model iteration narrow. Read-only calls may be batched, but
  # only one mutating side effect is allowed before the model sees its result.
  max_tool_calls_per_iteration: 3
  max_mutating_calls_per_iteration: 1
  # Independent read-only calls emitted in the same native batch can execute concurrently.
  max_parallel_readonly_tools: 3

  # Tool-produced screenshots/images are injected into the following Ollama
  # message so the multimodal main model can inspect the actual pixels.
  vision:
    sidecar_when_distinct: true
    max_observation_chars: 5000
    auto_attach_tool_media: true
    max_images_per_turn: 2
    max_image_bytes: 4194304
    # Experimental: the current model reports image support. Send image payloads
    # directly through the shared main/vision role so capability can be tested.
    # Set false again if the Ollama runner rejects multimodal requests.
    supports_images: true

  # Share bounded semantic state between the distinct main (4B) and fast (2B)
  # roles. Both use a 16K context, but this is prompt-level state sharing, not a
  # cross-model KV cache.
  # Raw tool output stays in the normal loop transcript and remains untrusted.
  model_context_sharing:
    enabled: true
    max_chars: 6000
    summary_chars: 2200
    recent_chars: 1800
    memory_chars: 1200
    tool_chars: 1600

  # Canonical harness-owned state shared by the main and fast models.
  # When enabled, this replaces duplicated old raw conversation context in the
  # main-model prompt instead of being appended on top of it.
  working_state:
    enabled: true
    main_history_turns: 1
    # Keep only the latest raw tool transactions; older evidence is persisted in
    # the bounded untrusted evidence digest to reduce repeated prompt ingestion.
    raw_tool_results: 2
    # Tier-1 microcompaction: keep a few older tool transactions as tiny
    # retrievable observation handles before dropping them entirely.
    archived_tool_results: 4
    archived_tool_preview_chars: 180
    evidence_render_chars: 3600
    # Drop native schemas for explicit checks once their evidence is satisfied
    # or deterministically blocked; this reduces later-turn prefill and discourages
    # small-model repetition of already-completed diagnostics.
    prune_satisfied_tool_schemas: true
    # Chat templates render tool schemas at the very top of the prompt, so any
    # change to the set - or to its order - invalidates the whole server-side
    # prefix cache and forces a full re-prefill. Prune and reorder only during
    # an iteration that must change the set anyway to expose a pending
    # requirement; repeats of completed checks are still suppressed
    # deterministically. Set to false to churn eagerly at the cost of TTFT.
    minimize_schema_churn: true
    suppress_completed_requirement_repeats: true
    max_render_chars: 7000
    objective_chars: 1600
    background_chars: 2200
    recent_context_chars: 1400
    memory_chars: 1200
    evidence_items: 10
    evidence_preview_chars: 480
    failure_items: 8
    validator_items: 6
    plan_items: 6

  # Before the last allowed tool-loop iteration, the fast model classifies the
  # loop and the harness injects constrained recovery guidance for the main model.
  tool_loop_validator:
    enabled: true
    # Three failed/no-progress attempts trigger validation before a fourth
    # unvalidated attempt. Persistent stalls can be revalidated, but are bounded.
    failed_step_attempts: 3
    max_interventions_per_turn: 3
    max_candidate_tools: 24
    timeout_seconds: 25
    max_transcript_chars: 12000
    # Use the same indefinite residency policy and 16K runner configuration as
    # every other fast-role request so Ollama does not reload it for validation.
    keep_alive: -1
    options:
      num_ctx: 16384
      temperature: 0.1
      top_p: 0.95
      top_k: 20
      num_predict: 128

  # Hard fact-type provenance/content validation before factual finalization.
  grounding:
    # Hard provenance/content gate for fact-retrieval answers. Models may choose
    # recovery actions, but cannot override a missing-evidence decision.
    enabled: true
    # Weather observations carried from a prior turn must be newer than this.
    weather_max_age_seconds: 10800
    # Discarding a candidate answer creates no new evidence, so the gate needs
    # its own budget or it can consume every remaining iteration of the turn.
    max_candidate_discards: 3

  # Reusable Unix-style workflows are persisted separately from conversation
  # memory. Recipe lookup uses SQLite FTS5 + token-overlap scoring and does not
  # depend on the optional embedding model.
  recipes:
    enabled: true
    suggest_after_success: true
    # A single tool call is not a reusable workflow and produces noisy,
    # ambiguous "save it" prompts after ordinary lookups.
    min_stages: 2
    semantic_match_threshold: 0.35
    preflight_limit: 3
    max_pipeline_stages: 16
    seed_builtin_compatibility: true
    # Absolute last fall-through: after normal corrective tool recovery fails,
    # let the fast validator propose one bounded ephemeral read-only recipe.
    validator_fallback_enabled: true
    validator_fallback_max_stages: 4
    validator_fallback_max_tools: 12
    # Small-model semantic extraction for automatic recipe generalization. The
    # fast model may only suggest names for literal values already present in a
    # successful trace; deterministic code validates and rewrites the recipe.
    fast_parameter_inference: true
    fast_parameter_min_stages: 2
    fast_parameter_max_calls_per_turn: 1

  # Native tool schemas are selected deterministically per turn to reduce prefill.
  max_tools_per_turn: 12

  # Context compaction normally reuses the main model so a single-model Ollama
  # server does not evict the interactive model. Set this to the fast model only
  # when the server can keep both models resident.
  compaction_model: ""
  # num_ctx here is used only when compaction_model is a *different* model.
  # Ollama keys a loaded runner by context size, so reusing the main model with
  # a smaller num_ctx would unload the warm interactive model; the worker
  # therefore keeps main_options.num_ctx in that case.
  compaction_options:
    num_ctx: 16384
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    num_predict: 512

  # Keep enough headroom for tool results while allowing substantially longer
  # interactive and research contexts. Compaction still bounds runaway history.
  context:
    num_ctx: 16384
    reserve_tokens: 2048
    recent_messages: 12
    summary_keep_messages: 8
    compact_at_tokens: 9000
    max_tool_output_chars: 4000
    tool_loop_reserve_tokens: 3072
    # Place the harness working-state/evidence blocks after the stable history.
    # Those blocks are rewritten every iteration; keeping them last preserves a
    # reusable KV prefix (system prompt + history) across tool-loop steps.
    volatile_blocks_last: true

  main_options:
    num_ctx: 16384
    temperature: 0.6
    top_p: 0.95
    top_k: 20

  fast_options:
    num_ctx: 16384
    temperature: 0.1
    top_p: 0.95
    top_k: 20

  system_prompt: |
    Local assistant for conversation, research, computer assistance, and workflows.
    Answer the current request directly and use only the capabilities supplied for that turn.

research:
  max_rounds: 3
  max_queries_per_round: 3
  max_results_per_query: 3
  max_total_sources: 16
  max_source_bytes: 2097152
  max_page_chars: 25000
  max_evidence_chars: 9000
  fetch_timeout_seconds: 10

  # Reports are planned first, then written section-by-section so evidence does
  # not compete with the entire output for one context window.
  report:
    target_words: 2000
    min_words: 1700
    max_words: 2400
    max_sections: 5
    section_evidence_chars: 12000
    plan_evidence_chars: 22000
    section_num_predict: 1100
    overview_num_predict: 900
    include_key_findings: true

    # Evidence contract for the dedicated report model. Claims are extracted
    # from raw source text with exact support excerpts before drafting. Every
    # generated section is then checked against that ledger and repaired before
    # it can enter the final report.
    factuality:
      enabled: true
      source_batch_size: 3
      source_raw_chars: 7000
      max_claims_per_source: 8
      max_repair_passes: 2
      claim_num_predict: 1400
      gate_num_predict: 900
      repair_num_predict: 1200
      write_audit_sidecars: true

    images:
      enabled: true
      max_images: 3
      max_bytes: 3145728

worker:
  poll_interval_seconds: 3
  heartbeat_seconds: 15
  # Bound a background compaction transport stall independently of the worker
  # lifecycle so one dead Ollama request cannot freeze maintenance forever.
  compaction_timeout_seconds: 120
  stale_job_seconds: 180
  # Hard safety ceiling for one claimed background job. The worker continues
  # heartbeats/monitoring while the job runs; if this ceiling is exceeded it
  # requeues/fails the job and exits so Compose can kill any stuck Python thread
  # and restart a clean worker process.
  max_job_runtime_seconds: 7200
  # Durable deterministic computations execute cooperatively. This limits one
  # worker slice only; a healthy computation may checkpoint and resume for an
  # arbitrary number of slices until HALT or explicit cancellation.
  durable_compute_quantum: 10000
  durable_compute_yield_delay_seconds: 1
  interactive_cooldown_seconds: 10
  min_available_memory_mb: 900
  # This is a scheduling guard, not an Ollama server limit. Keep the actual
  # Ollama MAX_LOADED_MODELS setting on the Ollama server/container.
  max_agent_vram_mb: 7200
  # Deprecated compatibility mirror. Background fast-model calls use the same
  # indefinite residency policy as the canonical agent configuration.
  fast_model_keep_alive: -1
  # Run cleanup only while foreground inference is idle.
  maintenance_interval_seconds: 21600
  ephemeral_retention_days: 30
  checkpoints_per_job: 25

host_monitor:
  enabled: true
  interval_seconds: 60
  memory_change_percent: 20
  high_memory_percent: 90
  high_disk_percent: 90
  high_temperature_celsius: 90

reminders:
  timezone: "America/Toronto"
  timer_dir: "/home/agent/.config/systemd/user"
  unit_prefix: "agent-reminder"
  systemctl_timeout: 10

self_optimization:
  # Candidates are opt-in jobs. They can read an immutable source mount and
  # write only under workspace_root; they never apply changes to the live tree.
  enabled: true
  source_root: "/app/source"
  workspace_root: "/app/workspace/self_optimization"
  allowed_paths:
    - "al_agent"
    - "webui"
    - "worker.py"
    - "tools"
    - "tests"
    - "scripts"
    - "config"
    - "README.md"
    - "Dockerfile"
    - "docker-compose.yml"
    - "requirements.txt"
    - "ollama.env.example"
  max_changed_files: 5
  max_source_chars: 32000
  max_patch_chars: 24000
  command_timeout_seconds: 300
  # Candidate tests run in the dedicated networkless Compose service.
  validation_runner_enabled: true
  validation_timeout_seconds: 900
  min_available_memory_mb: 2200
  # If bubblewrap is missing or blocked, validation fails closed instead of
  # running model-generated code in the worker namespace when the dedicated
  # validator is explicitly disabled.
  require_test_sandbox: true
  test_memory_limit_mb: 1536
  model_options:
    num_ctx: 16384
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    num_predict: 4096
  test_commands:
    - ["python", "-m", "compileall", "-q", "."]
    - ["python", "-m", "pytest", "-q"]
  benchmark_commands:
    - ["python", "scripts/benchmark_harness.py", "--max-source-tokens", "250000"]
