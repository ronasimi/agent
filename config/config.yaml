# One resident main model; tool candidates are retrieved deterministically.
agent:
  host: http://127.0.0.1:11434
  model: agent-main:4b
  model_source: hf.co/empero-ai/Qwen3.8-9B-Distill-GGUF:Q4_K_M
  keep_alive: -1
  # Qwen3.8's Ollama template accepts native tool definitions but emits tool
  # invocations using its XML-style <tool_call>/<function>/<parameter> grammar.
  tool_protocol: qwen_xml
  timezone: America/Toronto
  thinking_default: false
  supports_thinking: true
  # Non-generative catalog retrieval narrows the tool set before the resident
  # 4B model decides whether/which tool to call. No second Ollama model is used.
  tool_routing:
    candidate_limit: 8
    auto_activate_threshold: 0.80
    auto_activate_margin: 0.20
    min_candidate_score: 0.18
  main_options:
    num_ctx: 32768
    temperature: 0.2
    top_p: 0.9
    top_k: 20
    num_predict: 2048
  max_model_calls_per_turn: 24
  max_tool_calls_per_turn: 48
  max_tool_calls_per_iteration: 6
  max_active_tools: 16
  max_tool_schema_chars: 20000
  model_no_progress_max_retries: 3
  turn_hard_timeout_seconds: 600
  model_transport:
    timeout_seconds: 60
    queue_timeout_seconds: 90
  context:
    reserve_tokens: 2560
    max_tool_output_chars: 6000
    recent_messages: 100
  warmup:
    enabled: true
    # Prime the exact initial tool-schema/system prefix used by real turns.
    prime_system_prefix: true
    prime_tool_schemas: true
  vision:
    supports_images: false
    max_image_bytes: 4194304
  working_state:
    enabled: true
  recipes:
    enabled: true
    seed_builtin_compatibility: true
  model_traces:
    enabled: true
    path: /app/memory/model_calls.jsonl
    max_bytes: 268435456
  system_prompt: Local assistant for conversation, research, computer tasks, and workflows.
research:
  max_rounds: 3
  max_queries_per_round: 3
  max_results_per_query: 3
  max_total_sources: 16
  max_source_bytes: 2097152
  max_page_chars: 25000
  max_evidence_chars: 9000
  fetch_timeout_seconds: 10
  report:
    target_words: 2000
    min_words: 1700
    max_words: 2400
    max_sections: 5
    section_evidence_chars: 12000
    plan_evidence_chars: 22000
    section_num_predict: 1100
    overview_num_predict: 900
    include_key_findings: true
    factuality:
      enabled: true
      source_batch_size: 3
      source_raw_chars: 7000
      max_claims_per_source: 8
      max_repair_passes: 2
      claim_num_predict: 1400
      gate_num_predict: 900
      repair_num_predict: 1200
      write_audit_sidecars: true
    images:
      enabled: true
      max_images: 3
      max_bytes: 3145728
worker:
  poll_interval_seconds: 3
  heartbeat_seconds: 15
  compaction_timeout_seconds: 120
  stale_job_seconds: 180
  max_job_runtime_seconds: 7200
  durable_compute_quantum: 10000
  durable_compute_yield_delay_seconds: 1
  interactive_cooldown_seconds: 10
  min_available_memory_mb: 900
  max_agent_vram_mb: 7200
  fast_model_keep_alive: -1
  maintenance_interval_seconds: 21600
  ephemeral_retention_days: 30
  checkpoints_per_job: 25
host_monitor:
  enabled: true
  interval_seconds: 60
  memory_change_percent: 20
  high_memory_percent: 90
  high_disk_percent: 90
  high_temperature_celsius: 90
reminders:
  timezone: America/Toronto
  timer_dir: /home/agent/.config/systemd/user
  unit_prefix: agent-reminder
  systemctl_timeout: 10
self_optimization:
  enabled: true
  source_root: /app/source
  workspace_root: /app/workspace/self_optimization
  allowed_paths:
  - al_agent
  - webui
  - worker.py
  - tools
  - tests
  - scripts
  - config
  - README.md
  - Dockerfile
  - docker-compose.yml
  - requirements.txt
  - ollama.env.example
  max_changed_files: 5
  max_source_chars: 32000
  max_patch_chars: 24000
  command_timeout_seconds: 300
  validation_runner_enabled: true
  validation_timeout_seconds: 900
  min_available_memory_mb: 2200
  require_test_sandbox: true
  test_memory_limit_mb: 1536
  model_options:
    num_ctx: 32768
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    num_predict: 4096
  test_commands:
  - - python
    - -m
    - compileall
    - -q
    - .
  - - python
    - -m
    - pytest
    - -q
  benchmark_commands:
  - - python
    - diagnostics/benchmarks/benchmark_harness.py
    - --max-source-tokens
    - '250000'
